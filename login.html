<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · PadiPlan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mut:#5b6785;--line:#d5dce8;--hl:#ffd60a;--ok:#12806f;--bad:#c2410c;--acc:#2b4acb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1526;--card:#172038;--ink:#e8ecf6;--mut:#9aa6c4;--line:#2a3558;--ok:#3ec9b0;--bad:#fb923c;--acc:#7f9bff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:100%;max-width:410px}
.brand{text-align:center;margin-bottom:18px}
.brand h1{font:800 34px "Bricolage Grotesque","Trebuchet MS",sans-serif;margin:6px 0 0}
.brand p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--mut);font:600 14px system-ui;padding:9px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -3px var(--hl)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--acc);font:600 13px system-ui;cursor:pointer;padding:6px}
.go{width:100%;margin-top:18px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:12px;font:700 15px system-ui;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin:12px 0 0;color:var(--bad);font-weight:600;font-size:14px}
.hint{color:var(--mut);font-size:12px;margin-top:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
mark{background:var(--hl);color:#14213d;padding:0 4px;border-radius:3px}
</style></head><body>
<div class="wrap">
<div class="brand">
<svg width="76" height="76" viewBox="0 0 100 100" aria-hidden="true"><path d="M26 22 L38 34 L24 36Z M74 22 L62 34 L76 36Z" fill="#ffb703"/><ellipse cx="50" cy="58" rx="34" ry="34" fill="#ffb703"/><circle cx="36" cy="46" r="10" fill="#fff"/><circle cx="64" cy="46" r="10" fill="#fff"/><circle cx="38" cy="47" r="4.5" fill="#14213d"/><circle cx="62" cy="47" r="4.5" fill="#14213d"/><path d="M45 56 L55 56 L50 64Z" fill="#fb8500"/><rect x="44" y="66" width="12" height="6" rx="3" fill="#c2410c"/></svg>
<h1>PadiPlan</h1><p>வணக்கம்! <mark>Homework planned.</mark> Distractions off.</p></div>
<div class="card">
<div class="tabs" role="tablist"><button type="button" id="tLogin" class="on" role="tab">Log in</button><button type="button" id="tSignup" role="tab">Sign up</button></div>
<form id="f" novalidate>
<div id="nameRow" hidden><label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="40" placeholder="e.g. Priya"></div>
<label for="user">Username</label><input id="user" autocomplete="username" maxlength="24" placeholder="e.g. priya.k" autocapitalize="none" required>
<label for="pw">Password</label>
<div class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="show">Show</button></div>
<div id="confRow" hidden><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"><div class="hint">At least 6 characters.</div></div>
<div class="err" id="err" role="alert"></div>
<button class="go" id="go" type="submit">Log in</button>
</form></div></div>
<script>
const $=s=>document.querySelector(s);let mode="login";
function setMode(m){mode=m;$("#tLogin").classList.toggle("on",m==="login");$("#tSignup").classList.toggle("on",m==="signup");
 $("#nameRow").hidden=$("#confRow").hidden=m==="login";$("#go").textContent=m==="login"?"Log in":"Create account";
 $("#pw").autocomplete=m==="login"?"current-password":"new-password";$("#err").textContent=""}
$("#tLogin").onclick=()=>setMode("login");$("#tSignup").onclick=()=>setMode("signup");
$("#show").onclick=()=>{const p=$("#pw"),h=p.type==="password";p.type=h?"text":"password";$("#show").textContent=h?"Hide":"Show"};
$("#f").onsubmit=async e=>{e.preventDefault();const err=m=>$("#err").textContent=m;err("");
 const username=$("#user").value.trim(),password=$("#pw").value;
 if(!username||!password){err("Enter your username and password.");return}
 if(mode==="signup"&&password!==$("#pw2").value){err("The two passwords do not match.");return}
 $("#go").disabled=true;
 try{const r=await fetch("/api/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,name:$("#nm").value.trim()})});
  const j=await r.json().catch(()=>({}));if(r.ok){localStorage.setItem("padiplan_user",JSON.stringify({u:username.toLowerCase(),n:j.name||$("#nm").value.trim()||username}));location="/"}else err(j.error||"Something went wrong. Try again.")}
 catch(x){err("Cannot reach the server. Is node server.js running?")}
 finally{$("#go").disabled=false}};
</script></body></html>
